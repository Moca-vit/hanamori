<body data-root="../">
  <a class="visually-hidden" href="#main">本文へ移動</a>
  <div data-include="header"></div>
  <section class="page-hero">
    <div class="light-particles" data-particles="10" aria-hidden="true"></div>
    <span class="en">Contact</span>
    <h1>お問い合わせ</h1>
    <p>商品やご注文について、お気軽にお問い合わせください。</p>
    <nav aria-label="パンくずリスト"><ol class="breadcrumb" role="list"><li><a href="../index.html">トップ</a></li><li aria-current="page">お問い合わせ</li></ol></nav>
  </section>
  <main id="main">
    <section class="section">
      <div class="container container--narrow">
        <p style="margin-bottom:var(--space-lg);color:var(--color-text-soft)">よくいただくご質問は<a class="text-link" href="faq.html">よくある質問</a>にまとめています。</p>
        <form class="form" data-validate data-form-type="contact">
          <div class="form-field"><label for="name">お名前<span class="required">必須</span></label><input id="name" name="name" type="text" required autocomplete="name"><p class="form-error" aria-live="polite"></p></div>
          <div class="form-field"><label for="email">メールアドレス<span class="required">必須</span></label><input id="email" name="email" type="email" required autocomplete="email"><p class="form-error" aria-live="polite"></p></div>
          <div class="form-field"><label for="c-type">お問い合わせの種類<span class="required">必須</span></label><select id="c-type" name="type" required><option value="">選択してください</option><option>商品について</option><option>ご注文・配送について</option><option>その他</option></select><p class="form-error" aria-live="polite"></p></div>
          <div class="form-field"><label for="c-message">内容<span class="required">必須</span></label><textarea id="c-message" name="message" required minlength="10" data-message="10文字以上で入力してください"></textarea><p class="form-error" aria-live="polite"></p></div>
          <button class="button button--block" type="submit">送信する（デモ）</button>
        </form>
      </div>
    </section>
  </main>
  <div data-include="footer"></div>
</body>
